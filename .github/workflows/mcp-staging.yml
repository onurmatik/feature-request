name: MCP Staging Rehearsal
run-name: MCP staging ${{ inputs.source_commit }} @ ${{ inputs.image_digest }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full lowercase source commit SHA bound by the image provenance
        required: true
        type: string
      image_digest:
        description: Bare 64-character lowercase sha256 digest from MCP Image Candidate
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write

concurrency:
  group: mcp-staging-${{ inputs.image_digest }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/onurmatik/feature-request
  IMAGE_REF: ghcr.io/onurmatik/feature-request@sha256:${{ inputs.image_digest }}
  STAGING_HOST: staging.featurerequest.invalid
  STAGING_WEB: feature-request-staging-web-${{ github.run_id }}
  STAGING_MCP: feature-request-staging-mcp-${{ github.run_id }}
  STAGING_ENV: /tmp/feature-request-staging-${{ github.run_id }}.env

jobs:
  rehearse:
    name: Smoke and rollback digest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: feature_request_staging
          POSTGRES_USER: feature_request
          POSTGRES_PASSWORD: feature_request
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feature_request"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out rehearsal contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify digest inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          python - <<'PY'
          import os
          import re

          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_COMMIT"]):
              raise SystemExit("source_commit must be a full lowercase SHA-1")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ["IMAGE_DIGEST"]):
              raise SystemExit("image_digest must be bare lowercase sha256 hex")
          PY

      - name: Log in to GHCR for candidate pull
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify image provenance and source binding
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          ATTESTATION_RESULT: ${{ runner.temp }}/image-attestation.json
        run: |
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY" --format json > "$ATTESTATION_RESULT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          records = json.loads(Path(os.environ["ATTESTATION_RESULT"]).read_text())
          expected_source = os.environ["SOURCE_COMMIT"]
          expected_digest = os.environ["IMAGE_DIGEST"]
          for record in records:
              result = record.get("verificationResult", {})
              signature = result.get("signature", {})
              certificate = signature.get("certificate", {})
              statement = result.get("statement", {})
              subjects = statement.get("subject", [])
              if (
                  certificate.get("sourceRepositoryDigest") == expected_source
                  and any(
                      subject.get("name") == "ghcr.io/onurmatik/feature-request"
                      and subject.get("digest", {}).get("sha256") == expected_digest
                      for subject in subjects
                  )
              ):
                  break
          else:
              raise SystemExit("image provenance does not bind the requested source and digest")
          PY

      - name: Record production fail-closed baseline
        id: before
        run: |
          home=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://featurerequest.io/)
          mcp=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://featurerequest.io/mcp)
          oauth=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://featurerequest.io/.well-known/oauth-authorization-server)
          test "$home" = 200
          test "$mcp" = 404
          test "$oauth" = 404
          printf 'home=%s\nmcp=%s\noauth=%s\n' "$home" "$mcp" "$oauth" >> "$GITHUB_OUTPUT"

      - name: Create isolated staging environment
        run: |
          umask 077
          staging_secret=$(openssl rand -hex 32)
          {
            printf 'DATABASE_URL=postgresql://feature_request:feature_request@127.0.0.1:5432/feature_request_staging\n'
            printf 'DJANGO_SECRET_KEY=%s\n' "$staging_secret"
            printf 'DEBUG=false\n'
            printf 'ALLOWED_HOSTS=%s,127.0.0.1,localhost\n' "$STAGING_HOST"
            printf 'PUBLIC_BASE_URL=https://%s\n' "$STAGING_HOST"
            printf 'OAUTH_ISSUER=https://%s\n' "$STAGING_HOST"
            printf 'MCP_RESOURCE_URL=https://%s/mcp\n' "$STAGING_HOST"
            printf 'MCP_RESOURCE_METADATA_URL=https://%s/.well-known/oauth-protected-resource/mcp\n' "$STAGING_HOST"
            printf 'FEATURE_REQUEST_MCP_PRODUCTION_ENABLED=true\n'
            printf 'FEATURE_REQUEST_MCP_HOST=127.0.0.1\n'
            printf 'FEATURE_REQUEST_MCP_PORT=18001\n'
            printf 'FEATURE_REQUEST_MCP_CORS_ORIGINS=https://chatgpt.com,https://claude.ai,https://claude.com\n'
            printf 'FEATURE_REQUEST_TRUSTED_PROXY_IPS=127.0.0.1,::1\n'
            printf 'CSRF_TRUSTED_ORIGINS=https://%s\n' "$STAGING_HOST"
            printf 'ADMIN_EMAIL=staging-ops@example.invalid\n'
            printf 'EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend\n'
            printf 'OPENAI_API_KEY=\n'
          } > "$STAGING_ENV"

      - name: Migrate isolated PostgreSQL and start candidate
        run: |
          docker pull "$IMAGE_REF"
          docker run --rm --network host --env-file "$STAGING_ENV" "$IMAGE_REF" python manage.py migrate --noinput
          docker run --detach --rm --name "$STAGING_WEB" --network host --env-file "$STAGING_ENV" "$IMAGE_REF" gunicorn config.wsgi:application --bind 127.0.0.1:18000 --workers 1 --access-logfile - --access-logformat '%(p)s %(h)s %(m)s %(U)s %(H)s %(s)s %(L)s'
          docker run --detach --rm --name "$STAGING_MCP" --network host --env-file "$STAGING_ENV" "$IMAGE_REF" python -m feature_request_mcp
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --header "Host: $STAGING_HOST" --header 'X-Forwarded-Proto: https' http://127.0.0.1:18000/.well-known/oauth-authorization-server > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$STAGING_WEB" || true
          docker logs "$STAGING_MCP" || true
          exit 1

      - name: Exercise OAuth discovery and MCP challenge
        id: smoke
        run: |
          auth_json="$RUNNER_TEMP/authorization-server.json"
          resource_json="$RUNNER_TEMP/protected-resource.json"
          mcp_headers="$RUNNER_TEMP/mcp-headers.txt"
          curl --silent --show-error --fail --header "Host: $STAGING_HOST" --header 'X-Forwarded-Proto: https' http://127.0.0.1:18000/.well-known/oauth-authorization-server > "$auth_json"
          curl --silent --show-error --fail --header "Host: $STAGING_HOST" --header 'X-Forwarded-Proto: https' http://127.0.0.1:18000/.well-known/oauth-protected-resource/mcp > "$resource_json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          host = os.environ["STAGING_HOST"]
          auth = json.loads((Path(os.environ["RUNNER_TEMP"]) / "authorization-server.json").read_text())
          resource = json.loads((Path(os.environ["RUNNER_TEMP"]) / "protected-resource.json").read_text())
          assert auth["issuer"] == f"https://{host}"
          assert auth["authorization_endpoint"] == f"https://{host}/oauth/authorize/"
          assert auth["token_endpoint"] == f"https://{host}/oauth/token/"
          assert auth["registration_endpoint"] == f"https://{host}/oauth/register/"
          assert auth["revocation_endpoint"] == f"https://{host}/oauth/revoke/"
          assert resource["resource"] == f"https://{host}/mcp"
          assert resource["authorization_servers"] == [f"https://{host}"]
          assert resource["scopes_supported"] == ["read"]
          PY
          openid_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Host: $STAGING_HOST" --header 'X-Forwarded-Proto: https' http://127.0.0.1:18000/.well-known/openid-configuration)
          test "$openid_status" = 404
          mcp_status=$(curl --silent --show-error --output "$RUNNER_TEMP/mcp-body.json" --dump-header "$mcp_headers" --write-out '%{http_code}' --request POST --header "Host: $STAGING_HOST" --header 'Content-Type: application/json' --header 'Accept: application/json' --header 'MCP-Protocol-Version: 2026-07-28' --header 'Mcp-Method: server/discover' --data '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' http://127.0.0.1:18001/mcp)
          test "$mcp_status" = 401
          grep -Fi 'WWW-Authenticate: Bearer resource_metadata="https://staging.featurerequest.invalid/.well-known/oauth-protected-resource/mcp", scope="read"' "$mcp_headers"
          cors_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request OPTIONS --header "Host: $STAGING_HOST" --header 'Origin: https://chatgpt.com' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: authorization,content-type,mcp-protocol-version,mcp-method,mcp-name' http://127.0.0.1:18001/mcp)
          test "$cors_status" = 204
          printf 'oauth_discovery=passed\nmcp_challenge=passed\ncors_preflight=passed\n' >> "$GITHUB_OUTPUT"

      - name: Exercise cleanup and health commands
        id: operations
        run: |
          docker run --rm --network host --env-file "$STAGING_ENV" "$IMAGE_REF" python manage.py cleanup_mcp_oauth --batch-size 500
          docker run --rm --network host --env-file "$STAGING_ENV" "$IMAGE_REF" python manage.py check_mcp_oauth_health
          cleanup_runs=$(docker run --rm --network host --env-file "$STAGING_ENV" "$IMAGE_REF" python manage.py shell -c 'from mcp_oauth.models import OAuthCleanupRun; print(OAuthCleanupRun.objects.filter(success=True).count())' | tail -1)
          test "$cleanup_runs" -ge 1
          printf 'cleanup_runs=%s\nhealth=passed\n' "$cleanup_runs" >> "$GITHUB_OUTPUT"

      - name: Rehearse rollback to disabled route
        id: rollback
        run: |
          docker stop --time 30 "$STAGING_MCP" "$STAGING_WEB"
          if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:18001/mcp > /dev/null 2>&1; then
            echo 'MCP process remained reachable after rollback' >&2
            exit 1
          fi
          if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:18000/ > /dev/null 2>&1; then
            echo 'staging web process remained reachable after rollback' >&2
            exit 1
          fi
          home=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://featurerequest.io/)
          mcp=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://featurerequest.io/mcp)
          oauth=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://featurerequest.io/.well-known/oauth-authorization-server)
          test "$home" = "${{ steps.before.outputs.home }}"
          test "$mcp" = "${{ steps.before.outputs.mcp }}"
          test "$oauth" = "${{ steps.before.outputs.oauth }}"
          printf 'candidate_processes_removed=true\nproduction_home=%s\nproduction_mcp=%s\nproduction_oauth=%s\n' "$home" "$mcp" "$oauth" >> "$GITHUB_OUTPUT"

      - name: Create staging rehearsal evidence
        id: evidence
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CLEANUP_RUNS: ${{ steps.operations.outputs.cleanup_runs }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          postgresql_version=$(docker run --rm --network host --env-file "$STAGING_ENV" "$IMAGE_REF" python -c 'import os, psycopg; connection = psycopg.connect(os.environ["DATABASE_URL"]); cursor = connection.cursor(); cursor.execute("show server_version"); print(cursor.fetchone()[0]); connection.close()')
          export POSTGRESQL_VERSION="$postgresql_version"
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "server_version": "1.0.0",
              "status": "staging_smoke_and_rollback_passed_production_route_disabled",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "image": f'ghcr.io/onurmatik/feature-request@sha256:{os.environ["IMAGE_DIGEST"]}',
              "image_provenance_verified": True,
              "environment": {
                  "kind": "github_hosted_ephemeral",
                  "platform": "linux/amd64",
                  "database": "postgresql",
                  "database_version": os.environ["POSTGRESQL_VERSION"],
                  "public_hostname": "staging.featurerequest.invalid",
              },
              "checks": {
                  "migrations": "passed",
                  "oauth_discovery": "passed",
                  "mcp_bootstrap_challenge": "passed",
                  "cors_preflight": "passed",
                  "cleanup": "passed",
                  "cleanup_successful_runs": int(os.environ["CLEANUP_RUNS"]),
                  "health": "passed",
                  "candidate_processes_removed": True,
                  "production_home_status": 200,
                  "production_mcp_status": 404,
                  "production_oauth_metadata_status": 404,
              },
              "rollback_target": "existing_web_runtime_mcp_route_disabled",
              "production_route_enabled": False,
              "workflow": {
                  "repository": os.environ["REPOSITORY"],
                  "run_id": int(os.environ["RUN_ID"]),
                  "run_attempt": int(os.environ["RUN_ATTEMPT"]),
                  "url": f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',
              },
              "created_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          content = (json.dumps(payload, indent=2, sort_keys=True) + "\n").encode()
          Path("mcp-staging-rehearsal-evidence.json").write_bytes(content)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f'sha256={hashlib.sha256(content).hexdigest()}\n')
          PY

      - name: Attest staging rehearsal evidence
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mcp-staging-rehearsal-evidence.json

      - name: Upload staging rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-staging-rehearsal-${{ inputs.image_digest }}
          path: mcp-staging-rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Record staging result
        env:
          EVIDENCE_SHA256: ${{ steps.evidence.outputs.sha256 }}
          EVIDENCE_ATTESTATION: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            printf '## MCP staging rehearsal\n\n'
            printf -- '- Image: `%s`\n' "$IMAGE_REF"
            printf -- '- Evidence SHA-256: `%s`\n' "$EVIDENCE_SHA256"
            printf -- '- Evidence attestation: %s\n' "$EVIDENCE_ATTESTATION"
            printf -- '- Rollback target: `existing_web_runtime_mcp_route_disabled`\n'
            printf -- '- Production route enabled: `false`\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture candidate logs on failure
        if: failure()
        run: |
          docker logs "$STAGING_WEB" || true
          docker logs "$STAGING_MCP" || true

      - name: Remove isolated candidate processes
        if: always()
        run: |
          docker rm --force "$STAGING_MCP" "$STAGING_WEB" > /dev/null 2>&1 || true
          rm -f "$STAGING_ENV"
