# Include only after immutable MCP release approval. Preserve Authorization and modern MCP headers.
location = /mcp {
    # MCP query credentials are rejected and must never be copied into logs.
    access_log off;
    proxy_pass http://127.0.0.1:8001/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header Mcp-Method $http_mcp_method;
    proxy_set_header Mcp-Name $http_mcp_name;
    proxy_set_header X-Request-ID $request_id;
    # This is the only trusted edge; discard any client-supplied forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
}

location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
}

location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
}

location = /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /oauth/ {
    # Authorization queries contain state and PKCE material. The web unit logs
    # only Gunicorn's path atom (%U), never the query-string atom (%q).
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    # Persistent OAuth rate limits must use the edge-observed source address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 16k;
}
