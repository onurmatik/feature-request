tools:
  get_account_capabilities:
    title: Get account capabilities
    description: Return the six plan-independent capabilities and current project-count capacity for the authenticated actor.
    exposure: &public public
    input_schema: {$ref: "#/$defs/empty_input"}
    output_schema: {$ref: "#/$defs/account_capabilities"}
    authentication: &auth_required required
    required_scopes: &read_scope [read]
    required_capabilities: []
    resource_type: account
    ownership: authenticated_actor
    side_effect: read_only
    destructive: false
    open_world: false
    approval: &no_approval {mode: none, owner: none, conditions: [], confirmation_field: null, preconditions: []}
    idempotency: &no_idempotency {mode: not_required, key_field: null, key_scope: null, guarantee_hours: null, replay: not_applicable, conflict: not_applicable, uncertain_result: not_applicable}
    errors: [invalid_input, permission_denied, rate_limited]
    data_classification: {input: [], output: [account_metadata], untrusted_output: false, audit_redaction: []}
    audit_profile: read
    long_running: &not_long_running {mode: not_applicable, reason: The tool completes within one bounded request and does not create an operation.}

  list_projects:
    title: List projects
    description: List projects owned by the authenticated actor.
    exposure: *public
    input_schema: {$ref: "#/$defs/empty_input"}
    output_schema: {$ref: "#/$defs/project_list"}
    authentication: *auth_required
    required_scopes: *read_scope
    required_capabilities: [project_management]
    resource_type: project
    ownership: project_owner
    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: &project_read_errors [invalid_input, permission_denied, feature_unavailable, rate_limited]
    data_classification: &public_output {input: [], output: [public_untrusted_content], untrusted_output: true, audit_redaction: [raw_user_content, raw_url]}
    audit_profile: read
    long_running: *not_long_running

  get_project:
    title: Get project
    description: Get one project owned by the authenticated actor by stable project id.
    exposure: *public
    input_schema: {$ref: "#/$defs/project_id_input"}
    output_schema: {$ref: "#/$defs/project"}
    authentication: *auth_required
    required_scopes: *read_scope
    required_capabilities: [project_management]
    resource_type: project
    ownership: project_owner
    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: [invalid_input, permission_denied, not_found, feature_unavailable, rate_limited]
    data_classification: *public_output
    audit_profile: read
    long_running: *not_long_running

  get_project_spec:
    title: Get project spec
    description: Read one optional public Product Spec by public board identity.
    exposure: *public
    input_schema: {$ref: "#/$defs/project_spec_locator_input"}
    output_schema: {$ref: "#/$defs/project_spec"}
    authentication: *auth_required
    required_scopes: *read_scope
    required_capabilities: [project_specification]
    resource_type: project_spec
    ownership: public_board_authenticated
    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: [invalid_input, permission_denied, not_found, feature_unavailable, rate_limited]
    data_classification: *public_output
    audit_profile: read
    long_running: *not_long_running

  create_project:
    title: Create project
    description: Create a project owned by the authenticated actor without fetching or opening the supplied URL.
    exposure: *public
    input_schema: {$ref: "#/$defs/create_project_input"}
    output_schema: {$ref: "#/$defs/project"}
    authentication: *auth_required
    required_scopes: &write_scope [write]
    required_capabilities: [project_management]
    resource_type: project
    ownership: project_owner
    side_effect: reversible_write
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: &required_idempotency {mode: required, key_field: idempotency_key, key_scope: authenticated_actor_id+tool_name, guarantee_hours: 24, replay: return_original_result, conflict: idempotency_conflict, uncertain_result: authoritative_read_before_retry}
    errors: [invalid_input, permission_denied, capacity_reached, feature_unavailable, idempotency_conflict, rate_limited]
    data_classification: &public_write {input: [public_untrusted_content], output: [public_untrusted_content, restricted_operational_evidence], untrusted_output: true, audit_redaction: [raw_user_content, raw_url]}
    audit_profile: write
    long_running: *not_long_running

  update_project:
    title: Update project
    description: Update an owned project's name, tagline, or stored URL without fetching or opening the URL.
    exposure: *public
    input_schema: {$ref: "#/$defs/update_project_input"}
    output_schema: {$ref: "#/$defs/project"}
    authentication: *auth_required
    required_scopes: *write_scope
    required_capabilities: [project_management]
    resource_type: project
    ownership: project_owner
    side_effect: reversible_write
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *required_idempotency
    errors: [invalid_input, permission_denied, not_found, feature_unavailable, revision_conflict, idempotency_conflict, rate_limited]
    data_classification: *public_write
    audit_profile: write
    long_running: *not_long_running

  update_project_spec:
    title: Update project spec
    description: Create or replace an owned project's moderated public Product Spec with independent optimistic revision control and optional guarded auto-decline.
    exposure: *public
    input_schema: {$ref: "#/$defs/update_project_spec_input"}
    output_schema: {$ref: "#/$defs/project_spec"}
    authentication: *auth_required
    required_scopes: *write_scope
    required_capabilities: [project_specification]
    resource_type: project_spec
    ownership: project_owner
    side_effect: external_effect
    destructive: false
    open_world: true
    approval: {mode: always, owner: agent, conditions: [current_turn_explicit_user_intent], confirmation_field: null, preconditions: []}
    idempotency: *required_idempotency
    errors: [invalid_input, permission_denied, not_found, feature_unavailable, revision_conflict, idempotency_conflict, moderation_rejected, dependency_unavailable, approval_required, rate_limited]
    data_classification: *public_write
    audit_profile: external
    long_running: *not_long_running

  delete_project:
    title: Delete project
    description: Permanently delete an owned project and all requests and related records contained by it.
    exposure: *public
    input_schema: {$ref: "#/$defs/delete_project_input"}
    output_schema: {$ref: "#/$defs/project_delete_receipt"}
    authentication: *auth_required
    required_scopes: *write_scope
    required_capabilities: [project_management]
    resource_type: project
    ownership: project_owner
    side_effect: irreversible_write
    destructive: true
    open_world: false
    approval:
      mode: always
      owner: agent
      conditions: [current_turn_explicit_user_intent]
      confirmation_field: confirm_project_id
      preconditions: [get_project_same_turn, confirmation_matches_project_id]
    idempotency: *required_idempotency
    errors: [invalid_input, permission_denied, not_found, feature_unavailable, revision_conflict, idempotency_conflict, approval_required, confirmation_mismatch, rate_limited]
    data_classification: {input: [restricted_operational_evidence], output: [restricted_operational_evidence], untrusted_output: false, audit_redaction: []}
    audit_profile: destructive
    long_running: *not_long_running

  list_requests:
    title: List requests
    description: List public requests for one owner or one owner/project board using deterministic filters.
    exposure: *public
    input_schema: {$ref: "#/$defs/list_requests_input"}
    output_schema: {$ref: "#/$defs/request_list"}
    authentication: *auth_required
    required_scopes: *read_scope
    required_capabilities: [request_management]
    resource_type: request
    ownership: public_board_authenticated
    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: &public_read_errors [invalid_input, permission_denied, not_found, feature_unavailable, rate_limited]
    data_classification: *public_output
    audit_profile: read
    long_running: *not_long_running

  get_request:
    title: Get request
    description: Get one public feature request or bug by stable issue id.
    exposure: *public
    input_schema: {$ref: "#/$defs/issue_id_input"}
    output_schema: {$ref: "#/$defs/request"}
    authentication: *auth_required
    required_scopes: *read_scope
    required_capabilities: [request_management]
    resource_type: request
    ownership: public_board_authenticated
    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: *public_read_errors
    data_classification: *public_output
    audit_profile: read
