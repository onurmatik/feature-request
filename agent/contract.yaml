    required_scopes: *read_scope
    required_capabilities: [duplicate_evidence]
    resource_type: duplicate_candidate
    ownership: public_board_authenticated
    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: *public_read_errors
    data_classification: {input: [public_untrusted_content], output: [public_untrusted_content, restricted_operational_evidence], untrusted_output: true, audit_redaction: [raw_user_content]}
    audit_profile: read
    long_running: *not_long_running

  list_request_activity:
