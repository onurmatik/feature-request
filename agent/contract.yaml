    side_effect: read_only
    destructive: false
    open_world: false
    approval: *no_approval
    idempotency: *no_idempotency
    errors: *public_read_errors
    data_classification: {input: [], output: [public_untrusted_content, restricted_operational_evidence], untrusted_output: true, audit_redaction: [raw_user_content, raw_url]}
    audit_profile: read
    long_running: *not_long_running

  find_duplicate_candidates:
    title: Find duplicate candidates
    description: Return explainable lexical similarity candidates within one project; scores are evidence and never a duplicate decision.
    exposure: *public
    input_schema: {$ref: "#/$defs/duplicate_candidates_input"}
