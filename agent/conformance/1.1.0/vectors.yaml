      authenticated_client_id: client-1
      tenant_id: null
      scopes: [read, write]
      capabilities: [project_management, request_management, request_collaboration, duplicate_evidence, delivery_evidence, activity_feed, project_specification]
      ownership_fixture: authorized
      plan: free
    expected:
      result: &account_free
        capabilities: {project_management: true, request_management: true, request_collaboration: true, duplicate_evidence: true, delivery_evidence: true, activity_feed: true, project_specification: true}
        limits: {project_count: {used: 0, limit: 1, period: lifetime, reset_at: null}}
      audit: &audit_read {profile: read, record_fields: [authenticated_actor_id, authenticated_client_id, tool_name, target_resource, authorization_decisions, redacted_input_hash, result_or_error_code, request_id, utc_timestamp]}

