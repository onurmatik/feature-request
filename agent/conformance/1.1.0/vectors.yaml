schema_version: "1"
agent_contract_version: 1.1.0

categories:
  success: {status: covered, applies_to: all, vectors: [get_account_capabilities_success, list_projects_success, get_project_success, get_project_spec_success, create_project_success, update_project_success, update_project_spec_success, delete_project_success, list_requests_success, get_request_success, get_request_scope_assessment_success, list_request_comments_success, get_queue_snapshot_success, find_duplicate_candidates_success, list_request_activity_success, list_request_changes_success, list_delivery_artifacts_success, list_project_spec_proposals_success, create_request_success, reassess_request_scope_success, propose_project_spec_update_success, resolve_project_spec_proposal_success, link_duplicate_request_success, unlink_duplicate_request_success, link_delivery_artifact_success, unlink_delivery_artifact_success, update_request_success, transition_request_success, add_request_comment_success, update_request_comment_success]}
  invalid_input: {status: covered, applies_to: all, vectors: [invalid_input_matrix]}
  missing_capability: {status: covered, applies_to: [list_projects, get_project, get_project_spec, create_project, update_project, update_project_spec, delete_project, list_requests, get_request, get_request_scope_assessment, list_request_comments, get_queue_snapshot, find_duplicate_candidates, list_request_activity, list_request_changes, list_delivery_artifacts, list_project_spec_proposals, create_request, reassess_request_scope, propose_project_spec_update, resolve_project_spec_proposal, link_duplicate_request, unlink_duplicate_request, link_delivery_artifact, unlink_delivery_artifact, update_request, transition_request, add_request_comment, update_request_comment], vectors: [missing_capability_matrix]}
  ownership_isolation: {status: covered, applies_to: [list_projects, get_project, update_project, update_project_spec, delete_project, get_queue_snapshot, list_request_activity, list_request_changes, list_delivery_artifacts, list_project_spec_proposals, reassess_request_scope, propose_project_spec_update, resolve_project_spec_proposal, link_duplicate_request, unlink_duplicate_request, link_delivery_artifact, unlink_delivery_artifact, update_request, transition_request, update_request_comment], vectors: [ownership_isolation_matrix, ownership_filtering_matrix]}
  capability_plan_matrix: {status: covered, applies_to: all, vectors: [pro_plan_matrix]}
  quota_concurrency: {status: covered, applies_to: [create_project, update_project, update_project_spec, delete_project, reassess_request_scope, propose_project_spec_update, resolve_project_spec_proposal, link_duplicate_request, unlink_duplicate_request, link_delivery_artifact, unlink_delivery_artifact, update_request, transition_request, update_request_comment], vectors: [create_project_capacity_concurrency, revision_conflict_matrix]}
  idempotent_replay: {status: covered, applies_to: [create_project, update_project, update_project_spec, delete_project, create_request, reassess_request_scope, propose_project_spec_update, resolve_project_spec_proposal, link_duplicate_request, unlink_duplicate_request, link_delivery_artifact, unlink_delivery_artifact, update_request, transition_request, add_request_comment, update_request_comment], vectors: [mutation_replay_matrix, delivery_natural_key_reuse]}
  idempotency_conflict: {status: covered, applies_to: [create_project, update_project, update_project_spec, delete_project, create_request, reassess_request_scope, propose_project_spec_update, resolve_project_spec_proposal, link_duplicate_request, unlink_duplicate_request, link_delivery_artifact, unlink_delivery_artifact, update_request, transition_request, add_request_comment, update_request_comment], vectors: [mutation_conflict_matrix, delivery_natural_key_conflict]}
  approval: {status: covered, applies_to: [update_project_spec, delete_project, create_request, reassess_request_scope, propose_project_spec_update, transition_request, add_request_comment, update_request_comment], vectors: [approval_matrix, approval_granted_matrix]}
  uncertain_external_effect: {status: covered, applies_to: [update_project_spec, create_request, reassess_request_scope, propose_project_spec_update, add_request_comment, update_request_comment], vectors: [external_effect_uncertain_matrix, notification_unknown_after_commit_matrix]}
  redaction: {status: covered, applies_to: all, vectors: [redaction_matrix]}
  async_status: {status: not_applicable, applies_to: all, vectors: [], reason: Every 1.0.0 tool completes within a bounded request and no tool starts a long-running operation.}

error_coverage:
  invalid_input: {status: covered, vectors: [invalid_input_matrix]}
  permission_denied: {status: covered, vectors: [ownership_isolation_matrix]}
  not_found:
    status: not_applicable
    reason: No dedicated missing-resource fixture exists in the Contract-stage bundle; downstream service conformance must exercise each targetable tool's declared not_found behavior.
  capacity_reached: {status: covered, vectors: [create_project_capacity_concurrency]}
  quota_exhausted:
    status: not_applicable
    reason: Contract 1.0.0 defines no renewable usage quota; project_count is a lifetime capacity limit covered by capacity_reached.
  rate_limited:
    status: not_applicable
    reason: Contract 1.0.0 defines no deterministic global call-rate policy from which a service-level vector can derive retry timing.
  feature_unavailable: {status: covered, vectors: [missing_capability_matrix]}
  revision_conflict: {status: covered, vectors: [revision_conflict_matrix]}
  idempotency_conflict: {status: covered, vectors: [mutation_conflict_matrix, delivery_natural_key_conflict]}
  moderation_rejected:
    status: not_applicable
    reason: Moderation classification is provider-dependent and has no deterministic rejected-content fixture in the Contract-stage bundle; downstream service conformance must inject the rejection outcome.
  dependency_unavailable: {status: covered, vectors: [external_effect_uncertain_matrix]}
  approval_required: {status: covered, vectors: [approval_matrix]}
  confirmation_mismatch:
    status: not_applicable
    reason: The approval vectors cover missing and granted intent but do not include a separate mismatched confirm_project_id fixture; downstream service conformance must exercise the declared error.
  invalid_state:
    status: not_applicable
    reason: No deterministic invalid duplicate-relationship or request-transition fixture is included in this Contract-stage bundle; downstream service conformance must exercise the declared state guards.

