    status: not_applicable
    applies_to: all
    vectors: []
    reason: Every 1.0.0 tool completes within a bounded request and no tool starts a long-running operation.
error_coverage:
  invalid_input:
    status: covered
    vectors:
    - invalid_input_matrix
  permission_denied:
    status: covered
    vectors:
    - ownership_isolation_matrix
  not_found:
    status: not_applicable
    reason: No dedicated missing-resource fixture exists in the Contract-stage bundle; downstream service conformance must
      exercise each targetable tool's declared not_found behavior.
  capacity_reached:
    status: covered
    vectors:
    - create_project_capacity_concurrency
  quota_exhausted:
    status: not_applicable
    reason: Contract 1.0.0 defines no renewable usage quota; project_count is a lifetime capacity limit covered by capacity_reached.
  rate_limited:
    status: not_applicable
    reason: Contract 1.0.0 defines no deterministic global call-rate policy from which a service-level vector can derive retry
      timing.
  feature_unavailable:
    status: covered
    vectors:
    - missing_capability_matrix
  revision_conflict:
    status: covered
    vectors:
    - revision_conflict_matrix
  idempotency_conflict:
    status: covered
    vectors:
    - mutation_conflict_matrix
    - delivery_natural_key_conflict
  moderation_rejected:
    status: not_applicable
    reason: Moderation classification is provider-dependent and has no deterministic rejected-content fixture in the Contract-stage
      bundle; downstream service conformance must inject the rejection outcome.
  dependency_unavailable:
    status: covered
    vectors:
    - external_effect_uncertain_matrix
  approval_required:
    status: covered
    vectors:
    - approval_matrix
  confirmation_mismatch:
    status: not_applicable
    reason: The approval vectors cover missing and granted intent but do not include a separate mismatched confirm_project_id
      fixture; downstream service conformance must exercise the declared error.
  invalid_state:
    status: not_applicable
    reason: No deterministic invalid duplicate-relationship or request-transition fixture is included in this Contract-stage
      bundle; downstream service conformance must exercise the declared state guards.
